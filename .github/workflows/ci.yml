name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      # build = typecheck + тесты + dist; verify:package проверяет собранный пакет
      # так, как его увидит потребитель.
      - run: bun run build
      - run: bun run verify:package
      - run: bun run size

      # Манифест примеров: плагин не должен падать на живых компонентах.
      - run: bun run cem
