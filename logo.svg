<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- RWC Text -->
  <text x="100" y="120" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
        fill="url(#grad1)" text-anchor="middle">RWC</text>
  
  <!-- Reactive waves -->
  <path d="M 30 80 Q 50 70, 70 80 T 110 80 T 150 80 T 170 80" 
        stroke="#6366f1" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 30 140 Q 50 130, 70 140 T 110 140 T 150 140 T 170 140" 
        stroke="#8b5cf6" stroke-width="3" fill="none" opacity="0.6"/>
  
  <!-- Small component blocks -->
  <rect x="40" y="50" width="20" height="20" fill="#6366f1" opacity="0.7" rx="3"/>
  <rect x="140" y="50" width="20" height="20" fill="#8b5cf6" opacity="0.7" rx="3"/>
  <rect x="90" y="160" width="20" height="20" fill="#6366f1" opacity="0.7" rx="3"/>
</svg>